services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  migration:
    image: mindy-center-api:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_LOGGING: 'false'
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        '-d',
        'dist/database/data-source.js',
        'migration:run',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: mindy-center-api:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_LOGGING: 'false'
    ports:
      - '${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3000}:3000'
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
