# Optional VPS Files rollout. Always merge with compose.production.yaml.
# Services stay on the API's backend network; cloudflared must join that network.
services:
  minio:
    image: mindy-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./tools/minio
    restart: unless-stopped
    env_file:
      - .env.minio.production
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-provision:
    image: mindy-minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ./tools/minio
      dockerfile: client.Dockerfile
    profiles: ['provision']
    env_file:
      - .env.minio.production
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'

  api:
    environment:
      FILE_SCRATCH_DIRECTORY: /file-scratch
    tmpfs:
      - /file-scratch:size=${FILE_SCRATCH_TMPFS_SIZE:-768m},mode=1777

volumes:
  minio-data:
