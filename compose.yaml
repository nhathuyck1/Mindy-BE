services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mindy_center
      POSTGRES_USER: mindy
      POSTGRES_PASSWORD: mindy
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindy -d mindy_center']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
