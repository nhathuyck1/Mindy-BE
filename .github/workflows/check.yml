name: Check

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mindy_center_test
          POSTGRES_USER: mindy
          POSTGRES_PASSWORD: mindy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindy -d mindy_center_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests migrate this dedicated database from empty on every run.
      TEST_DATABASE_URL: postgresql://mindy:mindy@localhost:5432/mindy_center_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - name: Start MinIO for file integration tests
        run: |
          pnpm files:local:up
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:19000/minio/health/ready
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:http
      - name: Show MinIO logs on failure
        if: failure()
        run: docker compose -p mindy-files-test -f compose.files-test.yaml logs --no-color
      - name: Stop MinIO test fixture
        if: always()
        run: docker compose -p mindy-files-test -f compose.files-test.yaml down --volumes
