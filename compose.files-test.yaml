services:
  minio:
    image: mindy-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./tools/minio
    environment:
      MINIO_ROOT_USER: mindy-files-test
      MINIO_ROOT_PASSWORD: mindy-files-test-only-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001
    ports:
      - '127.0.0.1:19000:9000'
    volumes:
      - minio-files-test:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  minio-files-test:
