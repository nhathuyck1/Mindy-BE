openapi: 3.0.3
info:
  title: Firebase Cloud Messaging HTTP v1 subset
  version: '1'
  description: Local contract subset from https://firebase.google.com/docs/reference/fcm/rest/v1/projects.messages/send. No production credentials.
servers:
  - url: https://fcm.googleapis.com
paths:
  /v1/projects/{project}/messages:send:
    post:
      parameters:
        - in: path
          name: project
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [token, notification, data, webpush]
                  properties:
                    token: { type: string }
                    notification: { type: object }
                    data: { type: object }
                    webpush: { type: object }
      responses:
        '200':
          description: Provider accepted
          content:
            application/json:
              example: { name: 'projects/mindy-test/messages/simulated' }
        '400':
          description: Invalid payload
          content:
            application/json:
              example: { error: { status: INVALID_ARGUMENT, code: 400 } }
        '403':
          description: Project or credential failure
          content:
            application/json:
              example: { error: { status: PERMISSION_DENIED, code: 403 } }
        '404':
          description: Registration token unregistered
          content:
            application/json:
              example:
                error:
                  code: 404
                  status: NOT_FOUND
                  details:
                    - '@type': type.googleapis.com/google.firebase.fcm.v1.FcmError
                      errorCode: UNREGISTERED
        '429':
          description: Quota exhausted, retry at least 60 seconds
          content:
            application/json:
              example: { error: { status: RESOURCE_EXHAUSTED, code: 429 } }
        '503':
          description: Provider unavailable, honor Retry-After
          content:
            application/json:
              example: { error: { status: UNAVAILABLE, code: 503 } }
