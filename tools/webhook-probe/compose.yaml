services:
  probe:
    build: .
    image: mindy-webhook-probe:${PROBE_IMAGE_TAG:-step1}
    env_file: .env.probe
    environment:
      PROBE_HOST: 0.0.0.0
      PROBE_PORT: 3100
    ports:
      - '127.0.0.1:${PROBE_PUBLIC_PORT:-3100}:3100'
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
