services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mindy_center
      POSTGRES_USER: mindy
      POSTGRES_PASSWORD: mindy
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindy -d mindy_center']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

volumes:
  postgres-data:
  mailpit-data:
